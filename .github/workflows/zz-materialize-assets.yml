name: Materialize SANAAM Image Assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Decode exact image sources into assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/brand assets/products assets/industry assets/og
          decode(){ test -s "$1"; base64 --decode "$1" > "$2"; test -s "$2"; }
          decode asset-b64/logo.webp.b64 assets/brand/sanaam-logo-original.webp
          decode asset-b64/favicon.png.b64 assets/brand/favicon.png
          decode asset-b64/lineup.webp.b64 assets/products/lineup.webp
          decode asset-b64/pack-1l.webp.b64 assets/products/pack-1l.webp
          decode asset-b64/pack-4l.webp.b64 assets/products/pack-4l.webp
          decode asset-b64/pack-5l.webp.b64 assets/products/pack-5l.webp
          decode asset-b64/pack-20l.webp.b64 assets/products/pack-20l.webp
          decode asset-b64/pack-200l.webp.b64 assets/products/pack-200l.webp
          decode asset-b64/base-oil.webp.b64 assets/industry/base-oil.webp
          decode asset-b64/manufacturing.webp.b64 assets/industry/manufacturing.webp
          decode asset-b64/sanaam-og.jpg.b64 assets/og/sanaam-og-v8.jpg
          cp assets/og/sanaam-og-v8.jpg assets/og/sanaam-og-v6.jpg
          file assets/brand/sanaam-logo-original.webp assets/products/pack-5l.webp assets/products/pack-20l.webp assets/products/pack-200l.webp assets/og/sanaam-og-v8.jpg

      - name: Commit binary assets to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand/sanaam-logo-original.webp assets/brand/favicon.png assets/products assets/industry assets/og/sanaam-og-v8.jpg assets/og/sanaam-og-v6.jpg
          if git diff --cached --quiet; then
            echo 'Assets already materialized.'
            exit 0
          fi
          git commit -m 'Materialize SANAAM binary assets [skip ci]'
          git push origin HEAD:main
