name: Deploy SANAAM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sanaam-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://almohammdin.github.io/SANAAM-Lubricants/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/assets/brand dist/assets/products dist/assets/industry dist/assets/og

          cp index.html styles.css app.js config.js products.js translations.js site.webmanifest robots.txt sitemap.xml .nojekyll dist/
          cp assets/brand/pattern.svg dist/assets/brand/pattern.svg

          decode() {
            src="$1"
            out="$2"
            test -s "$src"
            base64 --decode "$src" > "$out"
            test -s "$out"
          }

          decode asset-b64/logo.webp.b64 dist/assets/brand/sanaam-logo-original.webp
          decode asset-b64/favicon.png.b64 dist/assets/brand/favicon.png
          decode asset-b64/lineup.webp.b64 dist/assets/products/lineup.webp
          decode asset-b64/pack-1l.webp.b64 dist/assets/products/pack-1l.webp
          decode asset-b64/pack-4l.webp.b64 dist/assets/products/pack-4l.webp
          decode asset-b64/pack-5l.webp.b64 dist/assets/products/pack-5l.webp
          decode asset-b64/pack-20l.webp.b64 dist/assets/products/pack-20l.webp
          decode asset-b64/pack-200l.webp.b64 dist/assets/products/pack-200l.webp
          decode asset-b64/base-oil.webp.b64 dist/assets/industry/base-oil.webp
          decode asset-b64/manufacturing.webp.b64 dist/assets/industry/manufacturing.webp
          decode asset-b64/sanaam-og.jpg.b64 dist/assets/og/sanaam-og-v8.jpg

          for file in \
            dist/assets/brand/sanaam-logo-original.webp \
            dist/assets/brand/favicon.png \
            dist/assets/products/lineup.webp \
            dist/assets/products/pack-1l.webp \
            dist/assets/products/pack-4l.webp \
            dist/assets/products/pack-5l.webp \
            dist/assets/products/pack-20l.webp \
            dist/assets/products/pack-200l.webp \
            dist/assets/industry/base-oil.webp \
            dist/assets/industry/manufacturing.webp \
            dist/assets/og/sanaam-og-v8.jpg; do
            test -s "$file"
          done

          if grep -Eiq 'Concept Product Catalogue|preliminary product|not a factory|ليست مصنعا|كتالوج منتج تجريبي|تجريبي' dist/index.html dist/translations.js; then
            echo 'Prototype wording found; refusing deployment.' >&2
            exit 1
          fi

          printf 'SANAAM build: %s\n' "$GITHUB_SHA" > dist/build.txt
          printf '{"commit":"%s","packs":["1L","4L","5L","20L","200L"],"og":"sanaam-og-v8.jpg"}\n' "$GITHUB_SHA" > dist/deploy-verification.json

      - name: Publish built site to gh-pages branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy SANAAM ${GITHUB_SHA}"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Setup Pages for Actions mode
        id: setup
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact for Actions mode
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy via Pages Actions mode
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Verify public deployment
        shell: bash
        env:
          PAGE_URL: https://almohammdin.github.io/SANAAM-Lubricants/
        run: |
          set -euo pipefail
          echo "Verifying ${PAGE_URL}"
          ok=0
          for attempt in $(seq 1 36); do
            if curl -fsSL --retry 2 "${PAGE_URL}build.txt?v=${GITHUB_SHA}" | grep -Fq "$GITHUB_SHA"; then
              ok=1
              break
            fi
            echo "Waiting for GitHub Pages, attempt ${attempt}/36"
            sleep 10
          done
          test "$ok" = 1

          for file in \
            assets/products/pack-1l.webp \
            assets/products/pack-4l.webp \
            assets/products/pack-5l.webp \
            assets/products/pack-20l.webp \
            assets/products/pack-200l.webp \
            assets/products/lineup.webp \
            assets/brand/sanaam-logo-original.webp \
            assets/brand/favicon.png \
            assets/industry/base-oil.webp \
            assets/industry/manufacturing.webp \
            assets/og/sanaam-og-v8.jpg; do
            curl -fsSL --retry 2 -o /tmp/check "${PAGE_URL}${file}?v=${GITHUB_SHA}"
            test -s /tmp/check
          done

          echo "Public deployment verified: ${GITHUB_SHA}"
