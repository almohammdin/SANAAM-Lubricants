name: Deploy SANAAM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html styles.css app.js assets-loader.js config.js products.js translations.js site.webmanifest robots.txt sitemap.xml .nojekyll dist/
          cp -R assets dist/assets
          test -s dist/assets/brand/sanaam-logo-original.webp
          test -s dist/assets/brand/favicon.png
          test -s dist/assets/products/lineup.webp
          test -s dist/assets/products/pack-1l.webp
          test -s dist/assets/products/pack-4l.webp
          test -s dist/assets/products/pack-5l.webp
          test -s dist/assets/products/pack-20l.webp
          test -s dist/assets/products/pack-200l.webp
          test -s dist/assets/industry/base-oil.webp
          test -s dist/assets/industry/manufacturing.webp
          test -s dist/assets/og/sanaam-og-v8.jpg
          printf 'SANAAM build: %s\n' "$GITHUB_SHA" > dist/build.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
