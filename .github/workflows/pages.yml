name: Deploy SANAAM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html styles.css overrides-v12.css app.js assets-loader.js config.js products.js translations.js translations-v12.js site.webmanifest robots.txt sitemap.xml .nojekyll sanaam-sales-assistant.css sanaam-sales-assistant.js sanaam-sales-voice-appcheck.js sanaam-sales-voice-playback.worklet.js sanaam-sales-voice-tools.js sanaam-sales-voice.js dist/
          cp -R assets dist/assets
          test -s dist/assets/brand/sanaam-logo.jpg
          test -s dist/assets/brand/favicon.png
          test -s dist/assets/products/lineup.jpg
          test -s dist/assets/products/pcmo-5w20.jpg
          test -s dist/assets/products/pcmo-5w30.jpg
          test -s dist/assets/products/pcmo-5w40.jpg
          test -s dist/assets/products/pcmo-10w30.jpg
          test -s dist/assets/products/pcmo-10w40.jpg
          test -s dist/assets/products/pcmo-15w50.jpg
          test -s dist/assets/products/pcmo-20w50.jpg
          test -s dist/assets/products/hdd-10w40.jpg
          test -s dist/assets/products/hdd-15w40.jpg
          test -s dist/assets/products/hdd-20w40.jpg
          test -s dist/assets/products/hdd-20w50.jpg
          test -s dist/assets/products/hdd-25w50.jpg
          test -s dist/assets/products/gear-ep90-gl4.jpg
          test -s dist/assets/products/brake-dot3.jpg
          test -s dist/assets/products/pack-1l.webp
          test -s dist/assets/products/pack-4l.webp
          test -s dist/assets/products/pack-5l.webp
          test -s dist/assets/products/pack-20l-v12.jpg
          test -s dist/assets/products/pack-200l-v12.jpg
          test -s dist/assets/industry/base-oil.jpg
          test -s dist/assets/industry/manufacturing.webp
          test -s dist/assets/og/sanaam-og-v12.jpg
          test -s dist/sanaam-sales-assistant.css
          test -s dist/sanaam-sales-assistant.js
          test -s dist/sanaam-sales-voice-appcheck.js
          test -s dist/sanaam-sales-voice-playback.worklet.js
          test -s dist/sanaam-sales-voice-tools.js
          test -s dist/sanaam-sales-voice.js
          printf 'SANAAM build: %s\n' "$GITHUB_SHA" > dist/build.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
