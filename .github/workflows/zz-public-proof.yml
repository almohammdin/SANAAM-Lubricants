name: Record SANAAM Public Verification

on:
  workflow_run:
    workflows: ["SANAAM Final Pages Deployment"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record verified public deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const content = [
              'PUBLIC_VERIFY_OK',
              'version=20260819-8',
              `commit=${headSha}`,
              'pack-5l=live-independent-image',
              'pack-20l=live-independent-image',
              'pack-200l=live-independent-image',
              'og-image=live',
              ''
            ].join('\n');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path: 'PUBLIC_DEPLOYMENT_OK.txt', ref: 'main'});
              sha = existing.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: 'PUBLIC_DEPLOYMENT_OK.txt',
              message: 'Record verified SANAAM public deployment [skip ci]',
              content: Buffer.from(content).toString('base64'),
              branch: 'main',
              ...(sha ? {sha} : {})
            });
