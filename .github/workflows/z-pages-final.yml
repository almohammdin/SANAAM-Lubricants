name: SANAAM Final Pages Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sanaam-pages-final
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Build exact public artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/assets/brand dist/assets/products dist/assets/industry dist/assets/og

          cp index.html styles.css app.js config.js products.js translations.js site.webmanifest robots.txt sitemap.xml .nojekyll dist/
          cp assets/brand/pattern.svg dist/assets/brand/pattern.svg

          decode() {
            test -s "$1"
            base64 --decode "$1" > "$2"
            test -s "$2"
          }

          decode asset-b64/logo.webp.b64 dist/assets/brand/sanaam-logo-original.webp
          cp dist/assets/brand/sanaam-logo-original.webp dist/assets/brand/sanaam-logo-transparent.webp
          decode asset-b64/favicon.png.b64 dist/assets/brand/favicon.png
          decode asset-b64/lineup.webp.b64 dist/assets/products/lineup.webp
          decode asset-b64/pack-1l.webp.b64 dist/assets/products/pack-1l.webp
          decode asset-b64/pack-4l.webp.b64 dist/assets/products/pack-4l.webp
          decode asset-b64/pack-5l.webp.b64 dist/assets/products/pack-5l.webp
          decode asset-b64/pack-20l.webp.b64 dist/assets/products/pack-20l.webp
          decode asset-b64/pack-200l.webp.b64 dist/assets/products/pack-200l.webp
          decode asset-b64/base-oil.webp.b64 dist/assets/industry/base-oil.webp
          decode asset-b64/manufacturing.webp.b64 dist/assets/industry/manufacturing.webp
          decode asset-b64/sanaam-og.jpg.b64 dist/assets/og/sanaam-og-v8.jpg
          cp dist/assets/og/sanaam-og-v8.jpg dist/assets/og/sanaam-og-v6.jpg

          for f in \
            dist/assets/brand/sanaam-logo-original.webp \
            dist/assets/brand/favicon.png \
            dist/assets/products/lineup.webp \
            dist/assets/products/pack-1l.webp \
            dist/assets/products/pack-4l.webp \
            dist/assets/products/pack-5l.webp \
            dist/assets/products/pack-20l.webp \
            dist/assets/products/pack-200l.webp \
            dist/assets/industry/base-oil.webp \
            dist/assets/industry/manufacturing.webp \
            dist/assets/og/sanaam-og-v8.jpg; do
              test -s "$f"
          done

          test "$(file -b --mime-type dist/assets/products/pack-5l.webp)" = "image/webp"
          test "$(file -b --mime-type dist/assets/products/pack-20l.webp)" = "image/webp"
          test "$(file -b --mime-type dist/assets/products/pack-200l.webp)" = "image/webp"
          test "$(file -b --mime-type dist/assets/og/sanaam-og-v8.jpg)" = "image/jpeg"

          grep -Fq 'data-sanaam-build="20260819-8"' dist/index.html
          grep -Fq 'pack-5l.webp?v=20260819-8' dist/index.html
          grep -Fq 'pack-20l.webp?v=20260819-8' dist/index.html
          grep -Fq 'pack-200l.webp?v=20260819-8' dist/index.html
          grep -Fq 'sanaam-og-v8.jpg' dist/index.html

          if grep -Eiq 'Concept Product Catalogue|preliminary product|not a factory|ليست مصنعا|كتالوج منتج تجريبي|تجريبي' dist/index.html dist/translations.js; then
            echo 'Unwanted prototype wording detected' >&2
            exit 1
          fi

          printf 'SANAAM build: %s\nVersion: 20260819-8\n' "$GITHUB_SHA" > dist/build.txt
          printf '{"commit":"%s","version":"20260819-8","pack5":"ok","pack20":"ok","pack200":"ok","og":"ok"}\n' "$GITHUB_SHA" > dist/deploy-verification.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the public website, not the repository
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Public URL: ${PAGE_URL}"
          verified=0
          for attempt in $(seq 1 24); do
            body="$(curl -fsSL --retry 2 "${PAGE_URL}build.txt?v=${GITHUB_SHA}" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -Fq "$GITHUB_SHA" && printf '%s' "$body" | grep -Fq '20260819-8'; then
              verified=1
              break
            fi
            echo "Waiting for public Pages CDN (${attempt}/24)"
            sleep 10
          done
          test "$verified" = 1

          curl -fsSL -o /tmp/5.webp "${PAGE_URL}assets/products/pack-5l.webp?v=${GITHUB_SHA}"
          curl -fsSL -o /tmp/20.webp "${PAGE_URL}assets/products/pack-20l.webp?v=${GITHUB_SHA}"
          curl -fsSL -o /tmp/200.webp "${PAGE_URL}assets/products/pack-200l.webp?v=${GITHUB_SHA}"
          curl -fsSL -o /tmp/og.jpg "${PAGE_URL}assets/og/sanaam-og-v8.jpg?v=${GITHUB_SHA}"
          test "$(file -b --mime-type /tmp/5.webp)" = "image/webp"
          test "$(file -b --mime-type /tmp/20.webp)" = "image/webp"
          test "$(file -b --mime-type /tmp/200.webp)" = "image/webp"
          test "$(file -b --mime-type /tmp/og.jpg)" = "image/jpeg"
          test "$(sha256sum /tmp/5.webp | cut -d' ' -f1)" != "$(sha256sum /tmp/20.webp | cut -d' ' -f1)"
          test "$(sha256sum /tmp/20.webp | cut -d' ' -f1)" != "$(sha256sum /tmp/200.webp | cut -d' ' -f1)"
          test "$(sha256sum /tmp/5.webp | cut -d' ' -f1)" != "$(sha256sum /tmp/200.webp | cut -d' ' -f1)"
          echo 'PUBLIC_VERIFY_OK: 5L, 20L and 200L are three independent live images; OG image is live.'
