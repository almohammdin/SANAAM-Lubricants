name: Materialize SANAAM assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode real image files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/brand assets/products assets/industry assets/og
          base64 --decode asset-b64/logo.webp.b64 > assets/brand/sanaam-logo-original.webp
          base64 --decode asset-b64/favicon.png.b64 > assets/brand/favicon.png
          base64 --decode asset-b64/lineup.webp.b64 > assets/products/lineup.webp
          base64 --decode asset-b64/pack-1l.webp.b64 > assets/products/pack-1l.webp
          base64 --decode asset-b64/pack-4l.webp.b64 > assets/products/pack-4l.webp
          base64 --decode asset-b64/pack-5l.webp.b64 > assets/products/pack-5l.webp
          base64 --decode asset-b64/pack-20l.webp.b64 > assets/products/pack-20l.webp
          base64 --decode asset-b64/pack-200l.webp.b64 > assets/products/pack-200l.webp
          base64 --decode asset-b64/base-oil.webp.b64 > assets/industry/base-oil.webp
          base64 --decode asset-b64/manufacturing.webp.b64 > assets/industry/manufacturing.webp
          base64 --decode asset-b64/sanaam-og.jpg.b64 > assets/og/sanaam-og.jpg

          file assets/brand/sanaam-logo-original.webp
          file assets/brand/favicon.png
          file assets/products/lineup.webp
          file assets/products/pack-1l.webp
          file assets/products/pack-4l.webp
          file assets/products/pack-5l.webp
          file assets/products/pack-20l.webp
          file assets/products/pack-200l.webp
          file assets/industry/base-oil.webp
          file assets/industry/manufacturing.webp
          file assets/og/sanaam-og.jpg

          test "$(file -b --mime-type assets/brand/sanaam-logo-original.webp)" = "image/webp"
          test "$(file -b --mime-type assets/brand/favicon.png)" = "image/png"
          test "$(file -b --mime-type assets/products/lineup.webp)" = "image/webp"
          test "$(file -b --mime-type assets/products/pack-1l.webp)" = "image/webp"
          test "$(file -b --mime-type assets/products/pack-4l.webp)" = "image/webp"
          test "$(file -b --mime-type assets/products/pack-5l.webp)" = "image/webp"
          test "$(file -b --mime-type assets/products/pack-20l.webp)" = "image/webp"
          test "$(file -b --mime-type assets/products/pack-200l.webp)" = "image/webp"
          test "$(file -b --mime-type assets/industry/base-oil.webp)" = "image/webp"
          test "$(file -b --mime-type assets/industry/manufacturing.webp)" = "image/webp"
          test "$(file -b --mime-type assets/og/sanaam-og.jpg)" = "image/jpeg"

      - name: Commit real assets to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/sanaam-logo-original.webp assets/brand/favicon.png assets/products/lineup.webp assets/products/pack-1l.webp assets/products/pack-4l.webp assets/products/pack-5l.webp assets/products/pack-20l.webp assets/products/pack-200l.webp assets/industry/base-oil.webp assets/industry/manufacturing.webp assets/og/sanaam-og.jpg
          if git diff --cached --quiet; then
            echo "Real assets already present."
            exit 0
          fi
          git commit -m "Materialize SANAAM image assets"
          git push origin HEAD:main
