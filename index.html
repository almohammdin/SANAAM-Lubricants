<!doctype html>
<html lang="so" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#064b3e">
  <title>SANAAM Lubricants | Saudi Automotive & Industrial Oils</title>
  <meta name="description" content="Saudi automotive, heavy-duty and industrial lubricants developed for export markets.">
  <link rel="canonical" href="https://almohammdin.github.io/SANAAM-Lubricants/">
  <link rel="icon" type="image/png" href="assets/brand/sanaam-icon.png">
  <link rel="apple-touch-icon" href="assets/brand/sanaam-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://almohammdin.github.io/SANAAM-Lubricants/">
  <meta property="og:title" content="SANAAM Lubricants | Saudi Automotive & Industrial Oils">
  <meta property="og:description" content="Saudi automotive, heavy-duty and industrial lubricants developed for export markets.">
  <meta property="og:image" content="https://almohammdin.github.io/SANAAM-Lubricants/assets/og/sanaam-og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SANAAM Lubricants | Saudi Automotive & Industrial Oils">
  <meta name="twitter:description" content="Saudi automotive, heavy-duty and industrial lubricants developed for export markets.">
  <meta name="twitter:image" content="https://almohammdin.github.io/SANAAM-Lubricants/assets/og/sanaam-og.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="top">
    <div class="container header-inner">
      <a href="#top" class="brand" aria-label="SANAAM Lubricants home"><img src="assets/brand/sanaam-logo.png" alt="SANAAM Lubricants" width="260" height="150"></a>
      <nav class="desktop-nav" aria-label="Primary">
        <a href="#products" data-i18n="nav.products"></a>
        <a href="#origin" data-i18n="nav.origin"></a>
        <a href="#packaging" data-i18n="nav.packaging"></a>
        <a href="#distributors" data-i18n="nav.distributors"></a>
      </nav>
      <div class="header-actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="so">Soomaali</button>
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="ar">العربية</button>
        </div>
        <button class="inquiry-pill" id="openInquiryTop" type="button"><span data-i18n="nav.inquiry"></span><b id="inquiryCount">0</b></button>
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Menu" aria-expanded="false">☰</button>
      </div>
    </div>
    <div class="mobile-nav" id="mobileNav">
      <a href="#products" data-i18n="nav.products"></a>
      <a href="#origin" data-i18n="nav.origin"></a>
      <a href="#packaging" data-i18n="nav.packaging"></a>
      <a href="#distributors" data-i18n="nav.distributors"></a>
    </div>
  </header>

  <main id="main">
    <section class="hero section-dark">
      <div class="hero-pattern" aria-hidden="true"></div>
      <div class="container hero-grid">
        <div class="hero-copy reveal">
          <span class="eyebrow" data-i18n="hero.eyebrow"></span>
          <h1 data-i18n="hero.title"></h1>
          <p class="hero-sub" data-i18n="hero.subtitle"></p>
          <p class="tagline" data-i18n="hero.tagline"></p>
          <p class="hero-body" data-i18n="hero.body"></p>
          <div class="hero-actions">
            <a href="#products" class="btn btn-gold" data-i18n="hero.explore"></a>
            <button type="button" class="btn btn-outline" id="heroInquiry" data-i18n="hero.build"></button>
          </div>
          <div class="hero-badges">
            <span class="origin-badge">✦ <span data-i18n="hero.badge"></span></span>
            <span>Saudi Base Oils</span><span>Saudi Manufacturing</span>
          </div>
        </div>
        <div class="hero-product reveal">
          <div class="product-halo"></div>
          <img src="assets/products/sanaam-4l-concept.png" alt="SANAAM 4L lubricant concept container" width="650" height="760" fetchpriority="high">
          <div class="pack-mini pack-one"><img src="assets/packaging/1l.svg" alt="1L SANAAM concept bottle"></div>
          <div class="pack-mini pack-five"><img src="assets/packaging/5l.svg" alt="5L SANAAM concept container"></div>
        </div>
      </div>
    </section>

    <section class="section origin-strip" id="origin">
      <div class="container">
        <div class="section-heading reveal">
          <span class="kicker" data-i18n="origin.kicker"></span>
          <h2 data-i18n="origin.title"></h2>
          <p data-i18n="origin.body"></p>
        </div>
        <div class="origin-cards" id="originChips"></div>
      </div>
    </section>

    <section class="section why-section">
      <div class="container why-grid">
        <div class="why-mark reveal"><img src="assets/brand/sanaam-icon.png" alt="SANAAM icon" loading="lazy"></div>
        <div class="section-heading reveal">
          <span class="kicker" data-i18n="why.kicker"></span>
          <h2 data-i18n="why.title"></h2>
          <p data-i18n="why.body"></p>
        </div>
      </div>
    </section>

    <section class="section products-section" id="products">
      <div class="container">
        <div class="section-heading reveal">
          <span class="kicker" data-i18n="featured.kicker"></span>
          <h2 data-i18n="featured.title"></h2>
          <p data-i18n="featured.body"></p>
        </div>
        <div class="product-grid" id="featuredProducts"></div>
        <div class="center"><button class="btn btn-dark" type="button" id="toggleRange" data-i18n="fullRange"></button></div>
        <div class="full-range" id="fullRange" hidden></div>
      </div>
    </section>

    <section class="section base-section">
      <div class="container base-grid">
        <div class="base-visual reveal" aria-hidden="true">
          <div class="tank t1"></div><div class="tank t2"></div><div class="tank t3"></div>
          <div class="pipe p1"></div><div class="pipe p2"></div>
          <span class="base-word">BASE OIL</span>
        </div>
        <div class="section-heading reveal">
          <span class="kicker" data-i18n="base.kicker"></span>
          <h2 data-i18n="base.title"></h2>
          <p data-i18n="base.body"></p>
          <div class="source-card">
            <div><span data-i18n="base.source"></span><strong>Aramco Base Oils</strong></div>
            <a id="aramcoLink" href="https://www.aramco.com/en/what-we-do/energy-products/refined-products/base-oils" target="_blank" rel="noopener noreferrer" data-i18n="base.learn"></a>
          </div>
        </div>
      </div>
    </section>

    <section class="section manufacturing-section">
      <div class="container manufacturing-grid">
        <div class="section-heading reveal">
          <span class="kicker" data-i18n="manufacturing.kicker"></span>
          <h2 data-i18n="manufacturing.title"></h2>
          <p data-i18n="manufacturing.body"></p>
          <div class="manufacturing-tags"><span>Blending</span><span>Laboratory</span><span>Filling</span><span>Warehouse</span></div>
        </div>
        <div class="industrial-visual reveal" aria-label="Abstract Saudi blending and filling facility visual">
          <div class="vessel v1"></div><div class="vessel v2"></div><div class="vessel v3"></div>
          <div class="conveyor"></div><div class="line"></div>
        </div>
      </div>
    </section>

    <section class="section family-section">
      <div class="container">
        <div class="section-heading reveal"><span class="kicker" data-i18n="families.kicker"></span><h2 data-i18n="families.title"></h2><p data-i18n="families.body"></p></div>
        <div class="family-grid" id="familyGrid"></div>
      </div>
    </section>

    <section class="section packaging-section" id="packaging">
      <div class="container">
        <div class="section-heading reveal"><span class="kicker" data-i18n="packaging.kicker"></span><h2 data-i18n="packaging.title"></h2><p data-i18n="packaging.body"></p></div>
        <div class="packaging-grid">
          <figure><img src="assets/packaging/1l.svg" alt="SANAAM 1L concept bottle" loading="lazy"><figcaption>1L</figcaption></figure>
          <figure><img src="assets/packaging/4l.svg" alt="SANAAM 4L concept container" loading="lazy"><figcaption>4L</figcaption></figure>
          <figure><img src="assets/packaging/5l.svg" alt="SANAAM 5L concept container" loading="lazy"><figcaption>5L</figcaption></figure>
          <figure><img src="assets/packaging/20l.svg" alt="SANAAM 20L concept pail" loading="lazy"><figcaption>20L</figcaption></figure>
          <figure><img src="assets/packaging/200l.svg" alt="SANAAM 200L concept drum" loading="lazy"><figcaption>200L</figcaption></figure>
        </div>
      </div>
    </section>

    <section class="section chain-section">
      <div class="container">
        <div class="section-heading reveal"><span class="kicker" data-i18n="chain.kicker"></span><h2 data-i18n="chain.title"></h2></div>
        <div class="chain" id="supplyChain"></div>
      </div>
    </section>

    <section class="section distributor-section" id="distributors">
      <div class="container distributor-grid">
        <div class="section-heading reveal"><span class="kicker" data-i18n="distributors.kicker"></span><h2 data-i18n="distributors.title"></h2><p data-i18n="distributors.body"></p><button class="btn btn-gold" type="button" id="distributorInquiry" data-i18n="distributors.cta"></button></div>
        <div class="distributor-points reveal" id="distributorPoints"></div>
      </div>
    </section>

    <section class="section inquiry-section" id="inquiry">
      <div class="container inquiry-cta reveal">
        <img src="assets/brand/sanaam-mono.png" alt="SANAAM monochrome logo" loading="lazy">
        <div><h2 data-i18n="inquiry.title"></h2><p data-i18n="featured.body"></p></div>
        <button class="btn btn-dark" id="openInquiryBottom" type="button" data-i18n="inquiry.open"></button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="footer-brand"><img src="assets/brand/sanaam-logo.png" alt="SANAAM Lubricants"><p data-i18n="footer"></p></div>
      <div class="concept-note"><strong data-i18n="concept.title"></strong><p data-i18n="concept.body"></p></div>
    </div>
  </footer>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="inquiry-drawer" id="inquiryDrawer" aria-hidden="true" aria-labelledby="inquiryTitle">
    <div class="drawer-head"><div><span class="kicker">SANAAM</span><h2 id="inquiryTitle" data-i18n="inquiry.title"></h2></div><button type="button" id="closeInquiry" class="close-btn" aria-label="Close">×</button></div>
    <div class="drawer-body">
      <div class="inquiry-items" id="inquiryItems"></div>
      <div class="inquiry-form">
        <label><span data-i18n="inquiry.market"></span><input id="inqMarket" autocomplete="country-name"></label>
        <label><span data-i18n="inquiry.company"></span><input id="inqCompany" autocomplete="organization"></label>
        <label><span data-i18n="inquiry.contact"></span><input id="inqContact" autocomplete="name"></label>
        <label><span data-i18n="inquiry.phone"></span><input id="inqPhone" inputmode="tel" autocomplete="tel"></label>
        <label class="full"><span data-i18n="inquiry.notes"></span><textarea id="inqNotes" rows="3"></textarea></label>
      </div>
      <div class="inquiry-preview"><pre id="inquiryPreview"></pre></div>
    </div>
    <div class="drawer-actions"><button class="btn btn-dark" id="copyInquiry" type="button" data-i18n="inquiry.copy"></button><button class="btn btn-gold" id="shareInquiry" type="button" data-i18n="inquiry.share"></button></div>
  </aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="products.js"></script>
  <script src="translations.js"></script>
  <script src="app.js"></script>
</body>
</html>
